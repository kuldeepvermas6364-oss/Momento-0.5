name: Momento Android Release APK

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Release notes"
        required: false
        type: string
        default: "Momento Android release build"
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-apk:
    name: Build signed Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64 secret" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/momento-release.jks"
          test -s "$RUNNER_TEMP/momento-release.jks"

      - name: Build signed Release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/momento-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :composeApp:clean :composeApp:assembleRelease

      - name: Verify APK output
        shell: bash
        run: |
          APK_PATH="$(find composeApp/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK_PATH" || (echo "Release APK was not generated" && exit 1)
          mkdir -p release-output
          cp "$APK_PATH" release-output/Momento-0.5-release.apk
          sha256sum release-output/Momento-0.5-release.apk | tee release-output/SHA256SUMS.txt

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Momento-0.5-Android-Release
          path: release-output/*
          if-no-files-found: error
          retention-days: 30
