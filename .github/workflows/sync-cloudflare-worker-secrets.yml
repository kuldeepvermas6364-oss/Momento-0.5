name: Sync Cloudinary secrets to Cloudflare Worker

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/sync-cloudflare-worker-secrets.yml

permissions:
  contents: read

jobs:
  sync-worker-secrets:
    name: Sync Worker secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check required GitHub secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
        run: |
          set -euo pipefail
          for name in CF_TOKEN CF_ACCOUNT CLOUDINARY_CLOUD_NAME CLOUDINARY_API_KEY CLOUDINARY_API_SECRET FIREBASE_WEB_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub secret for $name"
              exit 1
            fi
          done

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Sync secrets to momento-cloudinary-sign
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$CLOUDINARY_CLOUD_NAME" | wrangler secret put CLOUDINARY_CLOUD_NAME --name momento-cloudinary-sign
          printf '%s' "$CLOUDINARY_API_KEY" | wrangler secret put CLOUDINARY_API_KEY --name momento-cloudinary-sign
          printf '%s' "$CLOUDINARY_API_SECRET" | wrangler secret put CLOUDINARY_API_SECRET --name momento-cloudinary-sign
          printf '%s' "$FIREBASE_WEB_API_KEY" | wrangler secret put FIREBASE_WEB_API_KEY --name momento-cloudinary-sign
